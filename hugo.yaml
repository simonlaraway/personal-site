baseURL: 'https://simonlaraway.github.io/personal-site/'
locale: 'en-US'
title: 'Simon Laraway'
theme: 'hugo-PaperMod'
# canonifyURLs: false
# relativeURLs: false
author: 'Simon Laraway'

menu:
  main:
    - identifier: portfolio
      name: Portfolio
      url: /portfolio/
      weight: 30
    - identifier: about
      name: About Me/CV
      url:  /about/
    # - identifier: posts
    #   name: Posts
    #   url: /posts/
    #   weight: 20

module:
  mounts:
  - source: assets
    target: assets
  - source: static
    target: assets

params:
  mainSections:
  - about
  social: true
  author: 'Simon Laraway'  # Add it here too

markup:
  goldmark:
    renderer:
      unsafe: true

