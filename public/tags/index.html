</script><script>
    function showImage(imageNumber, container) {
        const imageContainer = container.querySelector('.image-container');
        const buttons = container.querySelectorAll('.toggle-btn');
        
        buttons.forEach((btn, index) => {
            if (index + 1 === imageNumber) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        
        if (imageNumber === 2) {
            imageContainer.classList.add('show-image-2');
        } else {
            imageContainer.classList.remove('show-image-2');
        }
    }

    function expandImage(event) {
        
        if (event.target.classList.contains('close-btn')) return;
        
        const imageContainer = event.currentTarget;
        const overlay = document.getElementById('imageOverlay') || createOverlay();
        
        
        const images = imageContainer.querySelectorAll('img');
        const currentImage = imageContainer.classList.contains('show-image-2') ? images[1] : images[0];
        const expandedImage = currentImage.cloneNode(true);
        
        
        expandedImage.style.cursor = 'pointer';
        expandedImage.addEventListener('click', closeOverlay);
        
        
        const contentDiv = overlay.querySelector('.overlay-content');
        contentDiv.innerHTML = '';
        contentDiv.appendChild(expandedImage);
        
        
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
        
        
        document.addEventListener('keydown', handleEscKey);
    }

    function createOverlay() {
        const overlay = document.createElement('div');
        overlay.id = 'imageOverlay';
        overlay.className = 'image-overlay';
        overlay.innerHTML = `
            <div class="overlay-content">
                <button class="close-btn" onclick="closeOverlay()">&times;</button>
            </div>
        `;
        document.body.appendChild(overlay);
        
        
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) {
                closeOverlay();
            }
        });
        
        return overlay;
    }

    function handleEscKey(event) {
        if (event.key === 'Escape' || event.key === 'Esc') {
            closeOverlay();
        }
    }

    function closeOverlay() {
        const overlay = document.getElementById('imageOverlay');
        if (overlay) {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
            
            document.removeEventListener('keydown', handleEscKey);
        }
    }

    
    document.addEventListener('DOMContentLoaded', function() {
        const imageContainers = document.querySelectorAll('.image-container');
        imageContainers.forEach(function(imageContainer) {
            imageContainer.style.cursor = 'pointer';
            imageContainer.addEventListener('click', expandImage);
        });
    });
</script>

<script>
    let menu = document.getElementById('menu');
    if (menu) {
        
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
